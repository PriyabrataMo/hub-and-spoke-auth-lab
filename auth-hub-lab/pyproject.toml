[project]
name = "auth-hub-lab"
version = "0.1.0"
description = "A local hub-and-spoke OIDC federation simulator for learning identity system design"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0,<4",
    "pyjwt[crypto]>=2.8,<3",
    "requests>=2.31,<3",
]

[project.scripts]
authlab = "authlab.run:main"

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/authlab"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
